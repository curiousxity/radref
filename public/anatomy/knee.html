<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knee atlas — interactive 3D anatomy for radiologists</title>
<style>
  @font-face {
    /* The same file the app shell already precaches, so this costs no extra bytes. */
    font-family:'Source Serif 4 Variable';
    font-style:normal;
    font-weight:200 900;
    font-display:swap;
    src:url('/fonts/source-serif-4-latin-wght-normal.woff2') format('woff2-variations');
  }
</style>
<style>
  :root{
    --ink:#1c2128; --slate:#2a313b; --slate-2:#353d49; --line:#46505d;
    --paper:#f3efe6; --paper-dim:#cfc9bc; --muted:#9aa3ae;
    --bone:#e9e2d0; --acl:#4fb3a9; --pcl:#9b7fd4; --mcl:#e0a458; --lcl:#e07a5f;
    --men:#8fb58e; --ten:#d9c27a; --cart:#bfd7e6; --fat:#d6c25a; --art:#d4453e; --nerve:#f2d15c;
    --stress:#ff5a48;
    --serif:'Source Serif 4 Variable', Georgia, "Times New Roman", serif;
    --sans:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:15px;line-height:1.5}
  body{display:flex;flex-direction:column;overflow:hidden}
  a{color:var(--acl)}
  button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
  button:hover{border-color:var(--paper-dim)}
  button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acl);outline-offset:2px}
  button[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}

  header{display:flex;align-items:baseline;gap:18px;padding:12px 18px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-family:var(--serif);font-weight:500;font-size:24px;margin:0;letter-spacing:.2px}
  header h1 small{font-family:var(--sans);font-size:13px;color:var(--muted);margin-left:10px;font-weight:400}
  .views{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
  .views button{padding:5px 10px;font-size:13px}

  main{flex:1;display:grid;grid-template-columns:1fr 400px;min-height:0}
  #viewport{position:relative;min-height:0;background:radial-gradient(ellipse at 50% 40%, #323a46 0%, var(--ink) 70%);overflow:hidden}
  #viewport canvas{display:block;width:100%;height:100%;touch-action:none}
  #leaders{position:absolute;inset:0;pointer-events:none;overflow:visible}
  #labels{position:absolute;inset:0;pointer-events:none}
  .lbl{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;background:rgba(28,33,40,.82);border:1px solid var(--line);border-radius:4px;padding:2px 7px;font-size:12px;white-space:nowrap;color:var(--paper);backdrop-filter:blur(2px);transition:opacity .15s}
  .lbl.dim{opacity:.26}
  .lbl.sel{border-color:var(--paper);background:var(--paper);color:var(--ink)}
  .lbl.bruise{background:var(--stress);border-color:var(--stress);color:#fff;font-weight:600;font-size:11px;padding:0;width:19px;height:19px;border-radius:50%;display:grid;place-items:center}
  .lbl .sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

  .hud{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:6px;max-width:210px}
  .hud details{background:rgba(28,33,40,.85);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
  .hud summary{cursor:pointer;font-weight:500;list-style:none}
  .hud summary::-webkit-details-marker{display:none}
  .hud label{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}
  .hud input[type=checkbox]{accent-color:var(--acl)}
  .hud input[type=range]{width:100%;accent-color:var(--acl)}
  .hud .rng{margin-top:6px}
  .hud hr{border:none;border-top:1px solid var(--line);margin:8px 0 6px}
  .hud .lblrow em{display:block;color:var(--muted);font-size:12px;font-style:normal}
  .hud select{width:100%;margin-top:3px;background:var(--slate-2);color:var(--paper);border:1px solid var(--line);border-radius:5px;padding:4px 5px;font:inherit;font-size:12.5px}
  .hud .rng span{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}

  .mechs{position:absolute;left:0;right:0;bottom:0;padding:10px 14px 12px;display:flex;gap:6px;flex-wrap:wrap;background:linear-gradient(to top, rgba(28,33,40,.95), rgba(28,33,40,0));}
  .mechs .t{width:100%;font-size:12px;color:var(--muted);margin-bottom:-2px}
  .mechs button{font-size:13px;background:rgba(28,33,40,.85)}
  .mechs button[aria-pressed="true"]{background:var(--stress);border-color:var(--stress);color:#fff}
  .mechs button.reset{margin-left:auto}

  #panel{border-left:1px solid var(--line);overflow-y:auto;padding:18px 22px 40px;background:var(--slate);min-height:0}
  #panel h2{font-family:var(--serif);font-weight:500;font-size:26px;margin:0 0 4px;line-height:1.15}
  #panel .kind{color:var(--muted);font-size:13px;margin-bottom:14px}
  #panel h3{font-family:var(--serif);font-weight:600;font-size:16px;margin:18px 0 4px;color:var(--paper)}
  #panel p{margin:0 0 8px;max-width:62ch;color:#e6e1d6}
  #panel ul{margin:0 0 8px;padding-left:18px;max-width:62ch}
  #panel li{margin:0 0 6px}
  .papers li{font-size:14px}
  .papers a{text-decoration:none;border-bottom:1px solid rgba(79,179,169,.4)}
  .papers a:hover{border-bottom-color:var(--acl)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
  .chip{font-size:13px;padding:4px 9px;border-radius:14px;display:inline-flex;align-items:center;gap:6px}
  .chip .sw{width:9px;height:9px;border-radius:50%}
  .chip[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
  .note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);margin-top:20px;padding-top:10px;max-width:62ch}
  .bruiselist{list-style:none;padding-left:0;max-width:62ch}
  .bruiselist li{display:flex;gap:9px;align-items:flex-start;margin-bottom:7px}
  .bruiselist b{flex:0 0 20px;height:20px;border-radius:50%;background:var(--stress);color:#fff;font-size:12px;display:grid;place-items:center;font-weight:600}
  .h3btn{font-size:12px;padding:2px 9px;border-radius:12px;margin-left:9px;vertical-align:2px;color:var(--muted);font-family:var(--sans);font-weight:400}
  .h3btn:hover{color:var(--paper)}
  .stresslist span{display:inline-block;padding:2px 8px;border-radius:12px;font-size:13px;margin:0 4px 4px 0;border:1px solid var(--line)}
  .stresslist span.tear{border-color:var(--stress);color:#ffb3aa}
  .back{margin-bottom:12px;font-size:13px}

  @media (max-width: 900px){
    main{grid-template-columns:1fr;grid-template-rows:56vh 1fr}
    #panel{border-left:none;border-top:1px solid var(--line)}
    .hud{max-width:170px}
    header h1{font-size:20px}
  }
  @media (prefers-reduced-motion: reduce){ .lbl{transition:none} }
</style>
</head>
<body>
<header>
  <h1>Knee atlas <small>left knee · bone anatomy from BodyParts3D · click any structure</small></h1>
  <div class="views" role="group" aria-label="Camera views">
    <button data-view="ant" aria-pressed="true">Front</button>
    <button data-view="lat">Outer side</button>
    <button data-view="post">Back</button>
    <button data-view="med">Inner side</button>
    <button data-view="top">Look down on tibia</button>
  </div>
</header>

<main>
  <section id="viewport" aria-label="3D knee model">
    <canvas id="c"></canvas>
    <svg id="leaders" aria-hidden="true"></svg>
    <div id="labels"></div>

    <div class="hud">
      <details open>
        <summary>Show / hide</summary>
        <label><input type="checkbox" data-layer="bone" checked> Bones</label>
        <label><input type="checkbox" data-layer="cart" checked> Cartilage</label>
        <label><input type="checkbox" data-layer="cruciate" checked> Cruciate ligaments</label>
        <label><input type="checkbox" data-layer="collateral" checked> Collaterals &amp; corners</label>
        <label><input type="checkbox" data-layer="menisci" checked> Menisci</label>
        <label><input type="checkbox" data-layer="tendon" checked> Tendons &amp; fascia</label>
        <label><input type="checkbox" data-layer="soft" checked> Fat pad, artery, nerve</label>
        <hr>
        <div class="lblrow"><em>Labels</em>
          <select id="lblSet" aria-label="Which labels to show">
            <option value="smart" selected>Follow what I'm doing</option>
            <option value="key">Key structures (9)</option>
            <option value="bones">Bones only</option>
            <option value="cruciate">Cruciates only</option>
            <option value="collateral">Collaterals &amp; corners</option>
            <option value="menisci">Menisci &amp; cartilage</option>
            <option value="tendon">Tendons &amp; fascia</option>
            <option value="soft">Fat, artery, nerve</option>
            <option value="all">Everything (22)</option>
            <option value="none">Only what I click</option>
          </select>
        </div>
        <div class="rng"><span><em>Bone see-through</em><b id="opv">0%</b></span><input type="range" id="boneOp" min="0" max="90" value="0"></div>
        <div class="rng"><span><em>Knee bend</em><b id="flexv">0°</b></span><input type="range" id="flex" min="0" max="90" value="0"></div>
      </details>
    </div>

    <div class="mechs" role="group" aria-label="Injury mechanisms">
      <div class="t">Play an injury mechanism — the model moves, stressed structures glow, and bone-bruise spots appear where MRI shows marrow oedema.</div>
      <button data-mech="pivot">Twist on planted foot (ACL)</button>
      <button data-mech="clip">Hit from the outside (MCL)</button>
      <button data-mech="dash">Dashboard (PCL)</button>
      <button data-mech="hyper">Hyperextension</button>
      <button data-mech="patella">Kneecap dislocation</button>
      <button data-mech="varus">Varus / posterolateral corner</button>
      <button data-mech="menisc">Twist under load (meniscus)</button>
      <button data-mech="jump">Jumping &amp; landing (tendons)</button>
      <button class="reset" id="resetMech">Reset</button>
    </div>
  </section>

  <aside id="panel" aria-live="polite"></aside>
</main>

<script src="./vendor/three.min.js"></script>
<script>
/* =========================================================
   CONTENT — papers (real, verified links), structures, mechanisms
   ========================================================= */
const PAPERS = {
  acl_rg:   {t:"ACL injury: MR imaging diagnosis and patterns of injury — RadioGraphics, 1992", u:"https://pubs.rsna.org/doi/10.1148/radiographics.12.5.1529133"},
  acl_mri:  {t:"Magnetic resonance imaging of anterior cruciate ligament injury — Orthopedic Research and Reviews, 2024", u:"https://www.tandfonline.com/doi/full/10.2147/ORR.S450336"},
  acl_assoc:{t:"High prevalence of associated injuries in ACL tears: MRI analysis of 254 patients — 2024", u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11410909/"},
  ramp:     {t:"Anterolateral ligament tears and ramp lesions in ACL-injured knees: a retrospective MRI analysis — 2023", u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10290041/"},
  pcl_buckle:{t:"PCL buckling angle and medial meniscus tear patterns in ACL-deficient knees — 2024", u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11353355/"},
  men_rg:   {t:"MR imaging–based diagnosis and classification of meniscal tears — RadioGraphics, 2014", u:"https://pubs.rsna.org/doi/10.1148/rg.344125202"},
  men_class:{t:"Expanded classification and pitfalls in interpretation of meniscal tears — RadioGraphics, 1993", u:"https://pubs.rsna.org/doi/10.1148/radiographics.13.3.8316659"},
  men_rev:  {t:"A current review of meniscus imaging — 2016", u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4766355/"},
  pcl_ajr:  {t:"MRI appearance of posterior cruciate ligament tears — AJR", u:"https://ajronline.org/doi/10.2214/AJR.07.2921"},
  pcl_patterns:{t:"PCL injury: MR imaging diagnosis and patterns of injury — Radiology, 1994", u:"https://pubmed.ncbi.nlm.nih.gov/8284399/"},
  pcl_heal: {t:"MRI of posterior cruciate ligament injuries: assessment of healing — Am J Sports Med", u:"https://pubmed.ncbi.nlm.nih.gov/10626911/"},
  plc_ajr:  {t:"The posterolateral corner of the knee — AJR", u:"https://ajronline.org/doi/full/10.2214/AJR.07.2051"},
  plc_jmri: {t:"MRI of the posterolateral corner injury: a concise review — JMRI, 2007", u:"https://onlinelibrary.wiley.com/doi/abs/10.1002/jmri.21013"},
  plc_sr:   {t:"MRI of posterolateral knee stabilizers: diagnosis and reporting considerations — Skeletal Radiology, 2026", u:"https://link.springer.com/article/10.1007/s00256-026-05146-x"},
  plc_stress:{t:"Varus stress MRI in the refined assessment of the posterolateral corner — 2022", u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9279472/"},
  pmc_rg:   {t:"Posteromedial corner of the knee: the neglected corner — RadioGraphics, 2015", u:"https://pubs.rsna.org/doi/abs/10.1148/rg.2015140166"},
  mcl_sr:   {t:"MCL injury: correlations between MRI features and clinical gradings — Skeletal Radiology, 2021", u:"https://link.springer.com/article/10.1007/s00256-021-03949-8"},
  mcl_rad:  {t:"MCL injuries: multiple signs, bone bruises and assessment with MR imaging — Radiology, 1995", u:"https://pubs.rsna.org/doi/abs/10.1148/radiology.194.3.7862987"},
  mcl_sys:  {t:"Imaging of the medial collateral ligament of the knee: a systematic review — 2022", u:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9596543/"},
  pat_ajr:  {t:"Transient lateral patellar dislocation: diagnosis with MR imaging — AJR, 1993", u:"https://ajronline.org/doi/10.2214/ajr.161.1.8517287"},
  pat_rs:   {t:"Transient lateral patellar dislocation — Radsource MRI Web Clinic (worked case with images)", u:"https://radsource.us/transient-lateral-patellar-dislocation/"},
  pat_ocl:  {t:"Patellar dislocation with osteochondral lesion of the lateral femoral condyle: case series — 2025", u:"https://www.sciencedirect.com/science/article/pii/S1930043325009951"},
  ext_rg94: {t:"MR imaging of injuries of the extensor mechanism of the knee — RadioGraphics, 1994", u:"https://pubs.rsna.org/doi/10.1148/radiographics.14.3.8066269"},
  ext_rg95: {t:"Extensor mechanism of the knee: functional anatomy and injury patterns — RadioGraphics, 1995", u:"https://pubs.rsna.org/doi/10.1148/radiographics.15.2.7761641"},
  ext_mri:  {t:"Do intra-articular injuries on preoperative MRI change management of extensor mechanism ruptures? — 2021", u:"https://pmc.ncbi.nlm.nih.gov/articles/PMC8670584/"},
  bruise:   {t:"Bone contusion patterns of the knee at MR imaging: footprint of the mechanism of injury — RadioGraphics, 2000", u:"https://pubs.rsna.org/doi/abs/10.1148/radiographics.20.suppl_1.g00oc19s135"},
  bruise_pm:{t:"Bone contusion patterns of the knee — abstract on PubMed", u:"https://pubmed.ncbi.nlm.nih.gov/11046168/"},
  all_ajr:  {t:"The anterolateral ligament: MRI appearance and association with the Segond fracture — AJR, 2015", u:"https://ajronline.org/doi/10.2214/AJR.14.12693"},
  segond:   {t:"The Segond fracture is an avulsion of the anterolateral complex — Am J Sports Med, 2017", u:"https://journals.sagepub.com/doi/10.1177/0363546517704845"},
  segond_sp:{t:"Segond fracture — StatPearls (open access overview)", u:"https://www.ncbi.nlm.nih.gov/books/NBK557810/"},
};

const C = { bone:0xe9e2d0, acl:0x4fb3a9, pcl:0x9b7fd4, mcl:0xe0a458, lcl:0xe07a5f, men:0x8fb58e, ten:0xd9c27a, cart:0xbfd7e6, fat:0xd6c25a, art:0xd4453e, nerve:0xf2d15c, mpfl:0xc98fb1, all:0xc9a06a };

/* Each structure: id, name, layer, colour, plain-language content, papers, related mechanisms */
const STRUCTS = {
  femur:{name:"Femur (thigh bone)", layer:"bone", color:C.bone, kind:"Bone",
    what:"The thigh bone. Its rounded lower end has two knuckles (the medial and lateral condyles) that roll and glide on the tibia. The groove at the front (the trochlea) is the track the kneecap slides in.",
    does:"Carries body weight into the knee. The shape of the condyles and of the groove decides how the knee bends and how the kneecap tracks.",
    normal:"Bright fatty marrow on T1, dark on fat-suppressed fluid images, with a smooth cartilage cap.",
    wrong:["Bone bruise (marrow oedema) – a footprint of the injury mechanism","Osteochondral injury and osteochondritis dissecans (adolescents)","Subchondral insufficiency fracture / spontaneous osteonecrosis (older patients, medial condyle)","Shallow groove (trochlear dysplasia) that lets the kneecap dislocate","Cartilage wear and osteoarthritis"],
    look:["Where the bruise sits tells you the mechanism – use the injury buttons below the model.","A deep notch on the lateral condyle on sagittal images (deep lateral femoral notch sign, more than 1.5 mm) suggests an ACL tear.","If the kneecap dislocated, measure trochlear depth and sulcus angle on axial images."],
    papers:["bruise","pat_rs"], mechs:["pivot","hyper","patella","clip"]},
  tibia:{name:"Tibia (shin bone)", layer:"bone", color:C.bone, kind:"Bone",
    what:"The shin bone. Its flat top (the plateau) has a medial and a lateral half, separated by two bony spines. The bump at the front (tibial tuberosity) is where the patellar tendon attaches; Gerdy's tubercle on the outer front is where the iliotibial band attaches.",
    does:"Receives all the load from the femur. The plateau slopes backwards a little; a steeper slope pushes the tibia forward and raises the risk of an ACL tear.",
    normal:"Fatty marrow, smooth cortex, cartilage covering both halves of the plateau.",
    wrong:["Plateau fractures (best staged on CT)","Tibial spine avulsion – the childhood version of an ACL tear","Segond fracture – a sliver of bone off the outer rim, almost always with an ACL tear","Bone bruises on the back of the plateau (pivot shift) or the front (dashboard, hyperextension)","Osgood–Schlatter: irritated tuberosity in adolescents"],
    look:["Tibia sitting more than 7 mm in front of the femur on sagittal images = ACL probably torn.","A flake of bone off the lateral rim on the x-ray = Segond fracture; the ACL is torn until proven otherwise.","A bruise on the front-inner plateau goes with posterolateral corner injury."],
    papers:["bruise","segond_sp","acl_mri"], mechs:["pivot","dash","hyper","varus"]},
  fibula:{name:"Fibula", layer:"bone", color:C.bone, kind:"Bone",
    what:"The thin outer leg bone. Only its head takes part in the knee: it is the anchor for the LCL and the biceps femoris tendon, and the common peroneal nerve wraps around its neck.",
    does:"Does not carry weight at the knee. Works as an anchor post for the outer (posterolateral) stabilisers.",
    normal:"A small rounded head sitting just below and behind the lateral tibial plateau.",
    wrong:["Avulsion of the tip of the head (arcuate sign) = posterolateral corner injury","Fibular head fracture","Peroneal nerve injury with foot drop"],
    look:["A small fragment above the fibular head on the x-ray means: look hard at the PCL and the posterolateral corner on the MRI."],
    papers:["plc_ajr","plc_jmri"], mechs:["varus"]},
  patella:{name:"Patella (kneecap)", layer:"bone", color:C.bone, kind:"Bone",
    what:"A bone embedded in the quadriceps tendon that slides up and down in the femoral groove.",
    does:"Acts as a pulley. It moves the tendon away from the joint centre, which makes the thigh muscle much stronger at straightening the knee.",
    normal:"Sits centred in the groove on axial images. Its cartilage is the thickest in the body (up to 6–7 mm).",
    wrong:["Dislocation – almost always to the outer side, and it usually pops back before anyone sees it","Cartilage softening and defects (chondromalacia), often on the inner facet","Fracture","Patella alta (sits too high) or baja (too low)","Bipartite patella – a normal variant at the upper-outer corner, not a fracture"],
    look:["Bruise on the inner-lower corner plus a bruise on the outer femoral condyle = the kneecap dislocated and relocated. Then check the MPFL and look for loose cartilage fragments.","Insall–Salvati ratio above 1.2 = patella alta, a risk factor for dislocation."],
    papers:["pat_ajr","pat_rs","ext_rg95"], mechs:["patella","jump","dash"]},
  acl:{name:"Anterior cruciate ligament (ACL)", layer:"cruciate", color:C.acl, kind:"Ligament",
    what:"A strong cord in the middle of the knee. It starts on the front of the tibia and runs up and back to the inner wall of the lateral femoral condyle. It has two bundles (anteromedial and posterolateral).",
    does:"Stops the tibia sliding forward and twisting inward. It matters most in cutting, pivoting and landing.",
    normal:"A straight, taut, dark band running parallel to the roof of the notch (Blumensaat line) on sagittal images. A slightly striped look is normal.",
    wrong:["Complete tear – usually in the middle third","Partial tear (one bundle)","Tibial spine avulsion instead of a tear (children)","Mucoid degeneration – swollen and bright but continuous ('celery stalk'); not a tear","Ganglion cyst","Graft failure or impingement after reconstruction"],
    look:["Direct signs: fibres missing, wavy, or lying flat instead of angled.","Indirect signs: pivot-shift bruises (mid lateral femoral condyle + back of the lateral tibial plateau), tibia more than 7 mm forward, buckled PCL, Segond fracture, uncovered lateral meniscus.","Always search the medial meniscus at the back for a ramp lesion and the lateral meniscus root – both are easy to miss and change the surgery.","Check the MCL and the posterolateral corner; ACL tears are rarely alone."],
    papers:["acl_rg","acl_mri","acl_assoc","ramp","pcl_buckle"], mechs:["pivot","hyper","clip"]},
  pcl:{name:"Posterior cruciate ligament (PCL)", layer:"cruciate", color:C.pcl, kind:"Ligament",
    what:"A thicker cord than the ACL. It starts on the back of the tibia below the joint line and runs up and forward to the inner wall of the medial femoral condyle.",
    does:"Stops the tibia sliding backward. It is the main stabiliser when the knee is bent and loaded (stairs, squats, kneeling).",
    normal:"Thick, uniformly dark, curved like a hockey stick on sagittal images. Normal thickness is up to about 6–7 mm.",
    wrong:["Sprain or partial tear – the ligament swells and turns bright but stays in one piece (the most common PCL injury)","Complete tear","Avulsion of its bony attachment from the back of the tibia","Chronic laxity – it heals 'long' and can look normal on MRI"],
    look:["A PCL thicker than 7 mm with bright signal inside = tear until proven otherwise.","Bruise on the front of the tibia = dashboard mechanism.","Tibia sagging backward on sagittal images.","Chronic tears often look intact but lax – MRI is much less reliable after 6 months.","High-energy injury with a PCL tear: check the posterolateral corner and the popliteal artery."],
    papers:["pcl_ajr","pcl_patterns","pcl_heal"], mechs:["dash","hyper","varus"]},
  mcl:{name:"Medial collateral ligament (MCL)", layer:"collateral", color:C.mcl, kind:"Ligament",
    what:"A broad, flat band on the inner side of the knee. It runs from the bump on the femur (medial epicondyle) to the tibia about 5 cm below the joint. There is a superficial layer and a deep layer; the deep layer is attached to the medial meniscus.",

renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));

scene.add(new THREE.HemisphereLight(0xffffff, 0x3a4250, 0.75));

const meshes = {};       // sid -> [mesh]
const pickables = [];
const dynamic = [];      // straps rebuilt when tibia / patella move
const layerMats = {};    // layer -> Set(material)

function mat(color, opts={}){
  const m = new THREE.MeshStandardMaterial(Object.assign({color, roughness:0.62, metalness:0.02}, opts));
  m.userData.baseColor = new THREE.Color(color);
  return m;
}
function register(mesh, sid){
  const s = STRUCTS[sid];
  mesh.userData.sid = sid;
  (meshes[sid] = meshes[sid] || []).push(mesh);
  pickables.push(mesh);
  (layerMats[s.layer] = layerMats[s.layer] || new Set()).add(mesh.material);
  return mesh;
}
function addTo(parent, mesh, worldPos){
  const piv = parent.userData.pivot;
  mesh.position.copy(piv ? worldPos.clone().sub(piv) : worldPos);
  parent.add(mesh); return mesh;
}

/* Strap / cord geometry along a curve with an elliptical cross-section.
   a = half-width (along the flat face), b = half-thickness, flatDir = direction the strap is thin in. */
function strapGeometry(points, a, b, flatDir, segs=34, rad=14, taperEnds=0.62, closed=false){
  const curve = new THREE.CatmullRomCurve3(points, closed, 'catmullrom', 0.4);
  const pos = [], idx = [];
  const S = new THREE.Vector3(), N = new THREE.Vector3();
  const rings = closed ? segs : segs+1;
  for(let i=0;i<rings;i++){
    const u = closed ? i/segs : i/segs;
    const P = curve.getPointAt(u % 1), T = curve.getTangentAt(u % 1).normalize();
    // tendons and ligaments narrow towards their attachments
    const w = closed ? 1 : taperEnds + (1-taperEnds)*Math.pow(Math.sin(Math.PI*u), 0.55);
    S.crossVectors(flatDir, T); if(S.lengthSq()<1e-6) S.set(1,0,0).cross(T); S.normalize();
    N.crossVectors(T, S).normalize();
    for(let j=0;j<rad;j++){
      const th = j/rad*Math.PI*2, ca=Math.cos(th)*a*w, sb=Math.sin(th)*b*w;
      pos.push(P.x + S.x*ca + N.x*sb, P.y + S.y*ca + N.y*sb, P.z + S.z*ca + N.z*sb);
    }
  }
  const last = closed ? segs : segs;
  for(let i=0;i<last;i++) for(let j=0;j<rad;j++){
    const i1=(i+1)%rings;
    const a0=i*rad+j, a1=i*rad+(j+1)%rad, b0=i1*rad+j, b1=i1*rad+(j+1)%rad;
    idx.push(a0,b0,a1, a1,b0,b1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
/* Transform an anchor point by the tibia / patella motion (w = how much it follows) */
const _tmp = new THREE.Vector3();
function xf(pt){
  if(!pt.w) return pt.p;
  const grp = pt.f==='p' ? patellaGroup : tibiaGroup;
  _tmp.copy(pt.p).sub(grp.userData.pivot).applyMatrix4(grp.matrixWorld);
  return pt.p.clone().lerp(_tmp, pt.w);
}
function makeStrap(sid, pts, a, b, flatDir, color, opts={}, taper=0.62, closed=false){
  const P = pts.map(q=>({p:V3(...q.p), f:q.f||'t', w:q.w||0}));
  const mesh = new THREE.Mesh(strapGeometry(P.map(xf), a, b, flatDir, 34, 14, taper, closed), mat(color, opts));
  mesh.userData.pts = P; mesh.userData.strap = [a,b,flatDir,taper,closed];
  root.add(mesh); register(mesh, sid);
  if(P.some(q=>q.w>0)) dynamic.push(mesh);
  return mesh;
}
function rebuildDynamic(){
  root.updateMatrixWorld(true);
  for(const m of dynamic){
    const [a,b,fd,tp,cl] = m.userData.strap;
    m.geometry.dispose();
    m.geometry = strapGeometry(m.userData.pts.map(xf), a, b, fd, 34, 14, tp, cl);
  }
  for(const s of bruiseSpheres) s.position.copy(xf(s.userData.pt));
}

/* ---- Decode the BodyParts3D meshes ---- */
function b64buf(s){ const b=atob(s), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
function decodeMesh(m){
  const pb=b64buf(m.p), q=new Uint16Array(pb.buffer, 0, m.nv*3);
  const pos=new Float32Array(m.nv*3);
  for(let i=0;i<m.nv;i++){ for(let k=0;k<3;k++) pos[i*3+k]=m.lo[k]+q[i*3+k]/65535*m.rg[k]; }
  const ib=b64buf(m.i);
  const idx=m.b16 ? new Uint16Array(ib.buffer,0,m.nt*3).slice() : new Uint32Array(ib.buffer,0,m.nt*3).slice();
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setIndex(new THREE.BufferAttribute(idx,1));
  g.computeVertexNormals();
  return g;
}
const boneMats=[];
function addMesh(key, sid, parent, material){
  const mesh=new THREE.Mesh(decodeMesh(KNEE.meshes[key]), material);
  addTo(parent, mesh, V3(0,0,0)); register(mesh, sid); return mesh;
}

  const m = mat(C.bone, {transparent:true, roughness:0.66}); boneMats.push(m);
  addMesh(key, sid, parent, m);
}

const sph = {theta:0.0, phi:1.30, r:34};
const target = V3(0,0.6,0);
let camDirty = true;
function applyCamera(){
  sph.phi = Math.max(0.12, Math.min(Math.PI-0.12, sph.phi));
  sph.r = Math.max(12, Math.min(75, sph.r));
  camera.position.set(target.x + sph.r*Math.sin(sph.phi)*Math.sin(sph.theta), target.y + sph.r*Math.cos(sph.phi), target.z + sph.r*Math.sin(sph.phi)*Math.cos(sph.theta));
  camera.lookAt(target); camDirty = true;
}
const VIEWS = {ant:[0,1.30], lat:[Math.PI/2,1.35], post:[Math.PI,1.30], med:[-Math.PI/2,1.35], top:[0.35,0.22]};
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{
  const [th,ph]=VIEWS[b.dataset.view]; sph.theta=th; sph.phi=ph; applyCamera();
  document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed', x===b));
  if(b.dataset.view==='top'){ setLayer('bone', true); boneOp.value=80; boneOp.dispatchEvent(new Event('input')); }
}));

const ptrs = new Map(); let dragStart=null, pinchD=0, moved=false;
canvas.addEventListener('pointerdown', e=>{ canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); dragStart={x:e.clientX,y:e.clientY}; moved=false;
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinchD=Math.hypot(a.x-b.x,a.y-b.y); } });
canvas.addEventListener('pointermove', e=>{
  if(!ptrs.has(e.pointerId)) { hoverAt(e.clientX,e.clientY); return; }
  const prev = ptrs.get(e.pointerId); const dx=e.clientX-prev.x, dy=e.clientY-prev.y; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(Math.hypot(e.clientX-dragStart.x, e.clientY-dragStart.y)>4) moved=true;
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); if(pinchD){ sph.r *= pinchD/d; } pinchD=d; applyCamera(); return; }
  sph.theta -= dx*0.008; sph.phi -= dy*0.008; applyCamera();
});
const endPtr = e=>{ ptrs.delete(e.pointerId); if(ptrs.size<2) pinchD=0; if(!moved && e.type==='pointerup') pickAt(e.clientX,e.clientY); };
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e=>{ e.preventDefault(); sph.r *= Math.exp(e.deltaY*0.0012); applyCamera(); }, {passive:false});

const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2();
function toNDC(cx,cy){ const r=canvas.getBoundingClientRect(); ndc.set(((cx-r.left)/r.width)*2-1, -((cy-r.top)/r.height)*2+1); }
let selected = null, hovered = null;
function hitAt(cx,cy){ toNDC(cx,cy); ray.setFromCamera(ndc,camera);
  const hits = ray.intersectObjects(pickables.filter(m=>m.visible && m.material.opacity>0.25), false);
  return hits.length ? hits[0].object.userData.sid : null; }
function hoverAt(cx,cy){ const sid = hitAt(cx,cy); canvas.style.cursor = sid ? 'pointer' : 'grab'; if(sid!==hovered){ hovered=sid; refreshLabelClasses(); } }
function pickAt(cx,cy){ const sid = hitAt(cx,cy); if(sid) select(sid); }
function select(sid){ selected = sid; updateHighlights(); showStructure(sid); refreshLabelClasses(); }

/* highlight state: selected (soft), stressed (glowing), torn (red) */
let stressSet = new Set(), tearSet = new Set();
function updateHighlights(){
  for(const sid in meshes) for(const m of meshes[sid]){
    const mt = m.material; if(mt===cartMat) continue;
    mt.emissive.setHex(0x000000); mt.color.copy(mt.userData.baseColor);
    if(sid===selected){ mt.emissive.copy(mt.userData.baseColor).multiplyScalar(0.45); }
  }
}
function pulseStress(time){
  const k = 0.55 + 0.45*Math.sin(time*5);
  for(const sid of new Set([...stressSet,...tearSet])){
    const torn = tearSet.has(sid);
    for(const m of meshes[sid]||[]){
      const mt = m.material; if(mt===cartMat) continue;
      if(torn){ mt.color.setHex(0xff5a48); mt.emissive.setHex(0xff2a1a); mt.emissiveIntensity = 0.35 + 0.5*k; }
      else { mt.color.copy(mt.userData.baseColor); mt.emissive.setHex(0xff8a3a); mt.emissiveIntensity = 0.15 + 0.25*k; }
    }
  }
}

/* Which labels are on screen. 'smart' shows the nine key structures, swaps to the
   structures involved when a mechanism plays, and always keeps whatever you clicked. */
const LABEL_SETS = {
  key:["femur","tibia","patella","acl","pcl","mcl","lcl","medmen","latmen"],
  bones:["femur","tibia","fibula","patella"],
  cruciate:["acl","pcl"],
  collateral:["mcl","lcl","mpfl","poplit","all"],
  menisci:["medmen","latmen","cart"],

let labelSet = 'smart';
const lblSel = document.getElementById('lblSet');
lblSel.addEventListener('change', ()=>{ labelSet = lblSel.value; camDirty = true; updateLabels(true); });
function setLabelSet(v){ labelSet = v; lblSel.value = v; camDirty = true; updateLabels(true); }
function activeLabelIds(){
  if(labelSet==='none') return selected ? new Set([selected]) : new Set();
  let ids;
  if(labelSet==='smart'){
    if(mech){ const M = MECHS[mech]; ids = [...M.tears, ...M.stressed.slice(0,5)]; }
    else ids = LABEL_SETS.key;
  } else ids = LABEL_SETS[labelSet] || [];
  const s = new Set(ids); if(selected) s.add(selected); return s;
}
let occlTick = 0;
function updateLabels(force){
  const r = canvas.getBoundingClientRect(), W=r.width, H=r.height;
  const active = activeLabelIds();
  const doOccl = camDirty || force || (occlTick++ % 30 === 0);
  const occluders = doOccl ? pickables.filter(m=>m.visible && m.material.opacity>0.5) : null;
  const placed = [];
  for(const sid in ANCHORS){
    const el = labelEls[sid], ln = leaderEls[sid];
    const on = layerState[STRUCTS[sid].layer] && active.has(sid);
    let p;
    if(on){ var wp = xf(ANCHORS[sid]); p = wp.clone().project(camera); }
    if(!on || p.z>1){ el.style.display='none'; ln.style.display='none'; continue; }
    const sx=(p.x*0.5+0.5)*W, sy=(-p.y*0.5+0.5)*H;
    const dx=sx-W/2, dy=sy-H/2, L=Math.hypot(dx,dy)||1; const off = 46 + Math.abs(dy)*0.12;
    placed.push({sid, el, ln, sx, sy, lx: sx+dx/L*off, ly: sy+dy/L*off, wp});
  }
  // nudge labels apart so they never sit on top of one another
  placed.sort((a,b)=>a.ly-b.ly);
  for(let i=1;i<placed.length;i++) for(let j=0;j<i;j++){
    const A=placed[j], B=placed[i];
    if(Math.abs(A.lx-B.lx) < 115 && B.ly-A.ly < 25) B.ly = A.ly + 25;
  }
  for(const q of placed){
    q.ly = Math.max(16, Math.min(H-16, q.ly));
    q.el.style.display=''; q.ln.style.display='';
    q.el.style.left = q.lx+'px'; q.el.style.top = q.ly+'px';
    q.ln.setAttribute('x1',q.sx); q.ln.setAttribute('y1',q.sy); q.ln.setAttribute('x2',q.lx); q.ln.setAttribute('y2',q.ly);
    if(doOccl){
      ray.set(camera.position, q.wp.clone().sub(camera.position).normalize());
      const d = camera.position.distanceTo(q.wp);
      const hits = ray.intersectObjects(occluders, false);
      const blocked = hits.length && hits[0].distance < d-0.35 && hits[0].object.userData.sid!==q.sid;
      q.el.classList.toggle('dim', !!blocked);
    }
  }
  for(const s of bruiseSpheres){
    const b = s.userData.badge; if(!b) continue;
    const p = s.position.clone().project(camera);
    if(p.z>1){ b.style.display='none'; continue; }
    b.style.display=''; b.style.left=((p.x*0.5+0.5)*W)+'px'; b.style.top=((-p.y*0.5+0.5)*H)+'px';
  }
}

  <h3>What to look for on the images</h3><ul>${s.look.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>
  <h3>How it gets injured</h3><div class="chips">${s.mechs.map(mechChip).join('')}</div>
  <h3>Papers with imaging examples</h3>${paperList(s.papers)}`;
  bindPanel();
}
function showMechanism(id){
  const M = MECHS[id]; M.bruises = M.bruises || (KNEE.bruises[id]||[]);
  panel.innerHTML = `<button class="back" data-home>← All structures</button>
  <h2>${esc(M.name)}</h2><div class="kind">Injury mechanism · playing on the model</div>
  <h3>What happens</h3><p>${esc(M.story)}</p>
  <h3>Structures under stress</h3><div class="stresslist">${M.tears.map(s=>`<span class="tear">${esc(STRUCTS[s].name)} – tears first</span>`).join('')}${M.stressed.map(s=>`<span>${esc(STRUCTS[s].name)}</span>`).join('')}</div>
  <div class="chips">${[...M.tears,...M.stressed].map(chip).join('')}</div>
  <h3>Bone-bruise footprint</h3>${M.bruises.length?`<ul class="bruiselist">${M.bruises.map((b,i)=>`<li><b>${i+1}</b><span>${esc(b.n)}</span></li>`).join('')}</ul>`:`<p>No typical bruise pattern – this is mainly a soft-tissue injury.</p>`}
  <h3>Check these on the images</h3><ul>${M.look.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>
  <h3>Papers with imaging examples</h3>${paperList(M.papers)}`;
  bindPanel();
}

/* =========================================================
   RENDER LOOP
   ========================================================= */
function resize(){
  const r = viewport.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false); camera.aspect = r.width/r.height; camera.updateProjectionMatrix();
  leaders.setAttribute('width', r.width); leaders.setAttribute('height', r.height); camDirty=true;
}
window.addEventListener('resize', resize);
let lastPoseKey = '';
function frame(now){
  if(mech || poseDirty){ applyPose(now); poseDirty=false; camDirty=true; }
  if(mech || stressSet.size) pulseStress(now/1000);
  renderer.render(scene, camera);
  updateLabels(); camDirty=false;
  requestAnimationFrame(frame);
}
resize(); applyCamera(); showHome(); canvas.style.cursor='grab';
requestAnimationFrame(frame);
</script>
</body>
</html>
