<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Wrist in 3D — anatomy, mechanics and injury for radiologists</title>
<style>
  @font-face {
    /* The same file the app shell already precaches, so this costs no extra bytes. */
    font-family:'Source Serif 4 Variable';
    font-style:normal;
    font-weight:200 900;
    font-display:swap;
    src:url('/fonts/source-serif-4-latin-wght-normal.woff2') format('woff2-variations');
  }
</style>
<style>
  :root{
    --ink:#1e2a38; --ink-2:#4a5866; --paper:#eef1f4; --paper-2:#e2e7ec; --line:#cfd6dd;
    --link:#1f6f8b; --injury:#c0392b; --ok:#2a7f62;
    --bone:#e4d6ba; --lig:#2a9d8f; --tendon:#e9a23b; --nerve:#f4e04d; --vessel:#c8383b; --ret:#8fc1bb; --tfcc:#9db8d6;
    --view-bg:#23282e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;color:var(--ink);background:var(--paper)}
  body{display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:18px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-family:'Source Serif 4 Variable', Georgia, serif;font-weight:600;font-size:19px;margin:0;letter-spacing:-.01em}
  header h1 small{display:block;font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;font-weight:400;font-size:12px;color:var(--ink-2);margin-top:2px}
  .spacer{flex:1}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;background:#fff;padding:7px 12px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--ink);color:#fff}
  .seg button:focus-visible{outline:2px solid var(--link);outline-offset:-2px}
  main{flex:1;display:flex;min-height:0}
  #viewwrap{flex:1;position:relative;background:var(--view-bg);min-width:0}
  #view{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #view.dragging{cursor:grabbing}
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .lbl{position:absolute;transform:translate(-50%,-140%);font-size:11.5px;line-height:1;padding:3px 6px;border-radius:4px;background:rgba(20,24,28,.72);color:#f2f2f2;white-space:nowrap;pointer-events:none;letter-spacing:.01em}
  .lbl.hover{background:#fff;color:var(--ink);font-weight:600;font-size:12.5px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .lbl.sel{background:#fff;color:var(--injury);font-weight:600}
  #overlay{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;max-width:calc(100% - 24px)}
  .card{background:rgba(255,255,255,.93);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--ink);backdrop-filter:blur(3px)}
  .card .row{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
  .card label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
  .sw{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.2)}
  .card select{font:inherit;font-size:12px;padding:2px 4px;border-radius:5px;border:1px solid var(--line)}
  #hint{position:absolute;right:12px;top:12px;font-size:12px;color:#cfd6dd;background:rgba(0,0,0,.35);padding:5px 9px;border-radius:6px;pointer-events:none;transition:opacity .4s}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cfd6dd;font-size:14px;background:var(--view-bg)}
  aside{width:430px;max-width:46%;background:var(--paper);border-left:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain}
  #panel{padding:18px 20px 40px}
  #panel h2{font-family:'Source Serif 4 Variable', Georgia, serif;font-size:22px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
  #panel h3{font-size:13.5px;font-weight:600;margin:18px 0 6px;color:var(--ink)}
  #panel p{font-size:14px;line-height:1.55;margin:0 0 8px}
  #panel ul{padding-left:18px;margin:4px 0 8px;font-size:14px;line-height:1.5}
  #panel li{margin-bottom:4px}
  .tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;margin:0 0 10px;color:#fff;background:var(--ink-2)}
  .tag.bone{background:#8a7a5c}.tag.lig{background:var(--lig)}.tag.tendon{background:#c47f1a}.tag.nerve{background:#a89a12}.tag.vessel{background:var(--vessel)}.tag.ret{background:#4f8e87}.tag.tfcc{background:#4b6e93}
  .plain{background:#fff;border-left:3px solid var(--link);padding:8px 12px;border-radius:0 6px 6px 0;margin-bottom:6px}
  .injury{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
  .injury b{display:block;color:var(--injury);font-size:14px;margin-bottom:4px}
  .injury p{margin:0 0 5px}
  .injury .img{color:var(--ink-2)}
  .injury .img::before{content:"On imaging: ";color:var(--ink);font-weight:600}
  .pearl{background:#fff7e6;border:1px solid #f0d9a8;border-radius:8px;padding:9px 12px;font-size:13.5px;line-height:1.5}
  a{color:var(--link)}
  .papers a{display:block;font-size:13.5px;line-height:1.4;margin-bottom:6px;text-decoration:none;padding:7px 10px;background:#fff;border:1px solid var(--line);border-radius:6px}
  .papers a:hover{border-color:var(--link)}
  .papers a span{display:block;font-size:11.5px;color:var(--ink-2);margin-top:2px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink)}
  .chip:hover{border-color:var(--ink)}
  .chip.mech{border-color:#e8b4ad;background:#fdf1ef;color:var(--injury)}
  .mechcard{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;font:inherit;cursor:pointer;color:var(--ink)}
  .mechcard:hover{border-color:var(--injury)}
  .mechcard b{display:block;font-size:14.5px;margin-bottom:3px}
  .mechcard span{font-size:13px;color:var(--ink-2);line-height:1.4}
  .stepnav{display:flex;align-items:center;gap:8px;margin:10px 0 14px}
  .stepnav button{font:inherit;font-size:13px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer}
  .stepnav button:disabled{opacity:.4;cursor:default}
  .stepnav .dots{display:flex;gap:5px;flex:1;justify-content:center}
  .stepnav .dot{width:9px;height:9px;border-radius:99px;background:var(--line);border:0;padding:0;cursor:pointer}
  .stepnav .dot.on{background:var(--injury)}
  .steptitle{font-size:16px;font-weight:600;margin:0 0 6px}
  .back{background:none;border:0;color:var(--link);font:inherit;font-size:13px;cursor:pointer;padding:0;margin-bottom:10px}
  .measure{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 10px}
  .measure td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  .measure td:first-child{font-weight:600;white-space:nowrap}
  details{margin:8px 0}
  summary{cursor:pointer;font-weight:600;font-size:14px}
  .note{font-size:12.5px;color:var(--ink-2);line-height:1.45}
  .qopt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:6px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
  .qopt:hover{border-color:var(--ink)}
  .qopt.right{border-color:var(--ok);background:#eaf5ef;font-weight:600}
  .qopt.wrong{border-color:var(--injury);background:#fbeeec}
  .qopt:disabled{cursor:default}
  .qscore{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-2);margin:6px 0 12px}
  .qbar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:12px}
  .qbar i{display:block;height:100%;background:var(--link)}
  .verdict{font-weight:600;margin:10px 0 4px}
  .verdict.ok{color:var(--ok)}.verdict.no{color:var(--injury)}
  .findbox{background:#fff;border:2px dashed var(--link);border-radius:8px;padding:14px;text-align:center;font-size:15px;margin:8px 0}
  @media (max-width:860px){
    main{flex-direction:column}
    #viewwrap{height:52vh;flex:none}
    aside{width:100%;max-width:none;flex:1;border-left:0;border-top:1px solid var(--line)}
    header h1{font-size:16px}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<header>
  <h1>The wrist in 3D <small>Right wrist. Real bone surfaces, simplified soft tissue. Click any structure. Drag to rotate, scroll to zoom.</small></h1>
  <div class="spacer"></div>
  <div class="seg" id="views" aria-label="Camera views">
    <button data-view="dorsal" class="on">Back of hand</button>
    <button data-view="volar">Palm side</button>
    <button data-view="radial">Thumb side</button>
    <button data-view="ulnar">Little-finger side</button>
    <button data-view="distal">Carpal-tunnel view</button>
  </div>
  <div class="seg" id="modes" aria-label="Mode">
    <button data-mode="explore" class="on">Explore anatomy</button>
    <button data-mode="mech">Injury mechanisms</button>
    <button data-mode="quiz">Quiz</button>
  </div>
</header>
<main>
  <div id="viewwrap">
    <canvas id="view"></canvas>
    <div id="labels"></div>
    <div id="hint">Hover to name a structure · click to open it</div>
    <div id="overlay">
      <div class="card">
        <div class="row" id="layers">
          <label><input type="checkbox" data-layer="bone" checked><i class="sw" style="background:var(--bone)"></i>Bones</label>
          <label><input type="checkbox" data-layer="tfcc" checked><i class="sw" style="background:var(--tfcc)"></i>TFCC</label>
          <label><input type="checkbox" data-layer="lig" checked><i class="sw" style="background:var(--lig)"></i>Ligaments</label>
          <label><input type="checkbox" data-layer="tendon" checked><i class="sw" style="background:var(--tendon)"></i>Tendons</label>
          <label><input type="checkbox" data-layer="nerve" checked><i class="sw" style="background:var(--nerve)"></i>Nerves</label>
          <label><input type="checkbox" data-layer="vessel" checked><i class="sw" style="background:var(--vessel)"></i>Arteries</label>
          <label><input type="checkbox" data-layer="ret" checked><i class="sw" style="background:var(--ret)"></i>Retinacula</label>
        </div>
      </div>
      <div class="card"><div class="row">
        <label>Labels
          <select id="labelmode">
            <option value="bone" selected>Bones</option>
            <option value="lig">Ligaments</option>
            <option value="tendon">Tendons</option>
            <option value="nerve">Nerves & arteries</option>
            <option value="all">Everything</option>
            <option value="none">None</option>
          </select>
        </label>
        <label><input type="checkbox" id="slice"> Cut away the hand at the carpal tunnel</label>
        <label><input type="checkbox" id="spin"> Slow spin</label>
      </div></div>
    </div>
    <div id="loading">Building the wrist…</div>
  </div>
  <aside><div id="panel"></div></aside>
</main>

 links:[P.impact,P.impactRG,P.uisRad,P.uisTfcc]},
ulnarStyloid:{name:"Ulnar styloid",group:"bone",
 plain:"The small spike on the end of the ulna. The deep part of the TFCC attaches to the fovea (a pit at its base), and the ECU tendon runs in a groove beside it.",
 does:"Anchors the TFCC and ulnocarpal ligaments, so it matters for DRUJ stability.",
 injuries:[
  {n:"Ulnar styloid fracture",how:"Very common with distal radius fractures. Tip fractures are usually harmless; base fractures can mean the TFCC foveal attachment has pulled off.",img:"Note the level (tip vs base) and displacement. A base fracture with a widened DRUJ suggests instability."},
  {n:"Ulnar styloid impaction / non-union",how:"An unusually long styloid, or a non-united fragment, rubs on the triquetrum.",img:"MRI: oedema in the styloid tip and adjacent triquetrum; a smooth corticated ossicle suggests old non-union."}],
 pearl:"An ossicle at the styloid tip is often an old non-union or a normal variant (os triangulare) — compare with the TFCC signal before calling it acute.",
 links:[P.impactRG,P.tfccBeyond]},
scaphoid:{name:"Scaphoid",group:"bone",
 plain:"A bean-shaped bone on the thumb side that bridges both rows of wrist bones. It is the most commonly fractured carpal bone (~80% of carpal fractures).",
 does:"Acts like a strut linking the two rows so they move as a unit. When you bend the wrist toward the thumb, the scaphoid flexes; toward the little finger, it stands up. Its blood supply enters near the far (distal) end and runs backward, so the near (proximal) pole has poor blood flow.",
 injuries:[
  {n:"Scaphoid fracture",how:"Fall on an outstretched hand with the wrist bent back — the scaphoid is caught between the radius and the distal row and snaps at the waist (~70%), proximal pole (~20%) or distal pole (~10%).",img:"Up to 20–40% are invisible on the first radiographs. If there is snuff-box tenderness and a normal X-ray, MRI within a few days is the most accurate next step (bone marrow oedema on fat-suppressed sequences). CT is best for showing the fracture line, displacement, angulation and healing."},
  {n:"Non-union and avascular necrosis (AVN)",how:"Missed or unstable fractures, especially of the proximal pole, do not heal; the proximal pole can die from loss of blood supply.",img:"CT: cyst-like resorption and sclerosis at the fracture, 'humpback' deformity (scaphoid flexed, lunate extended — DISI). MRI: low T1 signal in the proximal pole; gadolinium-enhanced MRI helps confirm dead bone."},
  {n:"SNAC wrist (scaphoid non-union advanced collapse)",how:"Years of abnormal motion after a non-union wear the joint out in a predictable order.",img:"Stage 1: arthritis at the radial styloid–distal scaphoid. Stage 2: whole radioscaphoid joint. Stage 3: capitolunate joint too. The radiolunate joint is spared."}],
 pearl:"Report the location (proximal/waist/distal), displacement > 1 mm, angulation, and any comminution — these decide surgery vs cast. Also check the SL interval and lunate position on the lateral view.",
 links:[P.scaphMRI,P.scaphReview,P.scaphMayo,P.scaphCBCT,P.slac]},
lunate:{name:"Lunate",group:"bone",
 plain:"The crescent-shaped bone in the middle of the near row. It sits in a dish on the radius and cups the head of the capitate above it.",
 does:"Works as the keystone, or 'intercalated segment', of the wrist. It has no tendons of its own — it just balances between the scaphoid (which pulls it forward) and the triquetrum (which pulls it back). If either neighbour ligament tears, the lunate tips: backward = DISI, forward = VISI.",
 injuries:[
  {n:"Perilunate and lunate dislocation",how:"Violent wrist hyperextension. The other carpal bones dislocate around the lunate (perilunate) or, in the last stage, the lunate itself is pushed out toward the palm (lunate dislocation).",img:"PA view: broken Gilula's arcs, a triangular 'piece of pie' lunate. Lateral view: 'spilled teacup' — the lunate tipped forward with the capitate no longer in its cup. See the Injury mechanisms mode for the Mayfield stages."},
  {n:"Kienböck disease (AVN of the lunate)",how:"Loss of blood supply, typically in young adults, often with a short ulna (negative ulnar variance) that overloads the lunate.",img:"Lichtman stages: I normal X-ray but MRI shows low T1 marrow signal; II sclerosis; IIIA collapse; IIIB collapse plus fixed scaphoid flexion; IV pan-carpal arthritis. CT best for collapse and fragmentation."},
  {n:"Ulnar impaction",how:"A long ulna bumps the ulnar corner of the lunate.",img:"Focal subchondral cysts, sclerosis or oedema on the ulnar side of the lunate (proximal-ulnar corner)."}],
 pearl:"On every lateral wrist film, draw the radius–lunate–capitate line. The lunate should point straight at the capitate; more than ~15° of tilt is instability. Normal scapholunate angle is 30–60°, capitolunate under 30°.",
 links:[P.kienAJR,P.kienNarr,P.kienCase,P.kienClass,P.perilAJR,P.instabGuide]},
triquetrum:{name:"Triquetrum",group:"bone",
 plain:"The three-cornered bone on the little-finger side of the near row. The pisiform sits on its palm-side face.",
 does:"The ulnar anchor of the proximal row. The dorsal radiocarpal and dorsal intercarpal ligaments attach to its back surface, which is why it is prone to small avulsion (pull-off) fractures.",
 injuries:[
  {n:"Dorsal triquetral avulsion (chip) fracture",how:"Second most common carpal fracture. A fall with the wrist bent back or a twist pulls off a flake of bone via the dorsal ligaments, or the ulnar styloid chisels it off.",img:"Small fleck of bone behind the carpus on the lateral view — easy to miss; MRI shows marrow oedema if needed."},
  {n:"Lunotriquetral (LT) ligament injury",how:"Fall backward onto the hand or chronic ulnar impaction.",img:"May look normal on X-ray. Look for a break in Gilula's arc, a VISI pattern (lunate tipped toward the palm), and fluid or a gap on MRI/MR arthrography."}],
 pearl:"A dorsal triquetral fleck is the most common fracture that shows only on the lateral view.",
 links:[P.instabGuide,P.radsource,P.impact]},
pisiform:{name:"Pisiform",group:"bone",
 plain:"A pea-sized bone embedded in the FCU tendon (a sesamoid). It sits on the palm-side of the triquetrum and forms one wall of Guyon's canal.",
 does:"Gives the FCU tendon a better angle to pull on. It is the ulnar-side attachment of the flexor retinaculum.",
 injuries:[
  {n:"Pisiform fracture / pisotriquetral arthritis",how:"Direct blow to the heel of the hand (fall, racket handle) or repetitive gripping.",img:"Needs a supinated oblique or carpal-tunnel view, or CT. Pisotriquetral joint narrowing and cysts on CT/MRI."}],
 pearl:"Ulnar nerve symptoms after a fall on the heel of the hand — think pisiform or hook of hamate fracture pressing into Guyon's canal.",
 links:[P.hamHook,P.guyon3T]},
trapezium:{name:"Trapezium",group:"bone",
 plain:"The far-row bone under the thumb. It has a saddle-shaped joint with the thumb metacarpal and a groove on its palm side for the FCR tendon.",
 does:"The saddle joint lets the thumb swing across the palm (opposition). It carries large pinch forces, which is why it wears out early.",
 injuries:[
  {n:"Thumb CMC (basal joint) osteoarthritis",how:"Wear and tear, most common in women over 50; the most frequently arthritic joint in the hand.",img:"Eaton stages: joint narrowing, subluxation, osteophytes, then spread to the scaphotrapeziotrapezoid (STT) joint."},
  {n:"Trapezial ridge fracture",how:"Direct blow to the palm.",img:"Hidden on standard views; carpal-tunnel view or CT."}],
 pearl:"FCR tendinopathy shows as fluid around the tendon in the trapezial groove — a common cause of radial-volar wrist pain that is mistaken for STT arthritis.",
 links:[P.hamHook,P.instabGuide]},
trapezoid:{name:"Trapezoid",group:"bone",
 plain:"The smallest far-row bone, wedged between the trapezium and capitate under the index finger.",
 does:"Locks the index metacarpal firmly — the 2nd CMC joint barely moves, giving the hand a stable pillar.",
 injuries:[{n:"Trapezoid fracture / dislocation",how:"Rare; axial force through the index metacarpal.",img:"CT — usually part of a wider CMC fracture-dislocation."}],
 pearl:"Isolated trapezoid injuries are so rare that when you see one, look for a CMC dislocation.",
 links:[P.instabGuide]},
capitate:{name:"Capitate",group:"bone",
 plain:"The largest carpal bone, in the centre of the wrist. Its rounded head fits into the cup formed by the lunate and scaphoid.",
 does:"The hub of the wrist: the axis of wrist movement passes through the capitate head. The middle finger metacarpal sits on top of it, transmitting load down the centre of the hand.",
 injuries:[
  {n:"Capitate fracture / scaphocapitate syndrome",how:"High-energy hyperextension: the capitate neck breaks and the head can flip 180° (greater-arc injury), often with a scaphoid fracture.",img:"Look for a rotated capitate head on the lateral view or CT; the head's blood supply is retrograde so AVN can follow."},
  {n:"Perilunate dislocation (stage II)",how:"The capitate is driven out of the lunate cup, usually backward.",img:"On the lateral view the capitate no longer sits in the lunate; the lunate stays on the radius."}],
 pearl:"The capitolunate angle should be under 30°; larger values mean the lunate has tipped (DISI or VISI).",
 links:[P.perilAJR,P.instabGuide]},
hamate:{name:"Hamate (body)",group:"bone",
 plain:"The wedge-shaped far-row bone under the ring and little fingers. A hook projects from its palm-side surface.",
 does:"Supports the 4th and 5th metacarpals, which have the most mobile CMC joints (this lets you cup your hand).",
 injuries:[
  {n:"Hamate body fracture (coronal)",how:"Punching with a clenched fist: the 4th/5th metacarpal bases are driven backward and shear off the dorsal part of the hamate.",img:"On the PA view look for overlap at the 4th/5th CMC joints, a 'double density', or an obscured hook ring. CT is the answer — radiographs miss about a quarter of these."},
  {n:"Hamatolunate impingement",how:"A type II lunate (extra facet for the hamate) rubs on the proximal hamate.",img:"Cartilage loss and oedema at the proximal pole of the hamate on MRI."}],
 pearl:"Any 4th/5th CMC dislocation has a hamate fracture until CT proves otherwise.",
 links:[P.hamBody,P.hamHook,P.impactRG]},
hamateHook:{name:"Hook of hamate",group:"bone",
 plain:"A bony hook on the palm side of the hamate. It is the ulnar wall of the carpal tunnel and the radial wall of Guyon's canal, and the flexor tendons to the ring and little fingers bend around it.",
 does:"Attachment for the flexor retinaculum and small hand muscles; acts as a pulley for the ring/little finger flexor tendons.",
 injuries:[
  {n:"Hook of hamate fracture",how:"The butt of a golf club, bat or racket strikes the heel of the palm during a mis-hit, or a fall on the palm.",img:"Standard views show it poorly; the carpal-tunnel view helps but hurts. CT is the reference standard (~97% accuracy vs ~80% for X-ray). MRI shows marrow oedema and checks the flexor tendons. Delayed diagnosis leads to non-union, ulnar nerve irritation and rupture of the ring/little finger flexor tendons."}],
 pearl:"On the PA view the hook should form a clear ring ('eye of the hamate'); an absent or blurred ring is a clue.",
 links:[P.hamHook,P.hamGolf,P.hamRTP]},
mc1:{name:"1st metacarpal (thumb)",group:"bone",
 plain:"The thumb's long bone. Its base articulates with the trapezium in a saddle joint.",
 does:"Swings the thumb across the palm; the base joint takes huge loads during pinch.",
 injuries:[
  {n:"Bennett fracture-dislocation",how:"Axial blow on a partly flexed thumb (punching, ball sports). A small volar-ulnar fragment stays with the trapezium while the rest of the metacarpal is pulled up and out by the APL tendon.",img:"Oblique fracture at the base with a small fragment left behind; the shaft is subluxed radially/dorsally. CT for surgical planning."},
  {n:"Rolando fracture",how:"Same mechanism, but the base shatters into a Y or T pattern.",img:"Comminuted intra-articular base fracture; CT."}],
 pearl:"Bennett vs Rolando matters for treatment: the APL pull makes Bennett fractures unstable even when they look 'small'.",
 links:[P.instabGuide]},
mc2:{name:"2nd–3rd metacarpals",group:"bone",
 plain:"The index and middle finger long bones. Their bases are locked to the trapezoid and capitate.",
 does:"The fixed central pillar of the hand; the ECRL, ECRB and FCR tendons all pull on their bases.",
 injuries:[{n:"CMC fracture-dislocation (2nd/3rd)",how:"Uncommon — needs high-energy dorsal force.",img:"Loss of the normal parallel 'M' pattern of the CMC joints on the PA view; CT."}],
 pearl:"On a true PA view every CMC joint space should be visible and parallel; overlap means dislocation.",
 links:[P.instabGuide]},
mc4:{name:"4th–5th metacarpals",group:"bone",
 plain:"The ring and little finger long bones. Their bases sit on the hamate.",
 does:"The mobile ulnar side of the hand — the 5th CMC joint moves ~30°, letting you cup the palm.",
 injuries:[{n:"4th/5th CMC fracture-dislocation",how:"Punching with a closed fist; the bases are driven backward off the hamate.",img:"Overlap at the CMC joints on the PA view, dorsal displacement on the lateral; coronal hamate fracture on CT."}],
 pearl:"Fist-fight injury with normal-looking metacarpal shafts? Look at the CMC joints and the hamate.",
 links:[P.hamBody]},

/* ---------------- CARTILAGE ---------------- */
tfcc:{name:"TFCC (triangular fibrocartilage complex)",group:"tfcc",
 plain:"A hammock of fibrocartilage and ligaments on the little-finger side of the wrist. Its central disc sits between the ulna head and the lunate/triquetrum; its edges thicken into the dorsal and volar radio-ulnar ligaments, which attach at the ulnar fovea and styloid.",
 does:"Cushions the ulnar side of the carpus, transmits about 20% of wrist load to the ulna, and is the main stabiliser of the distal radio-ulnar joint. The central disc has no blood supply (so it does not heal); the periphery does.",
 injuries:[
  {n:"Traumatic tear (Palmer class 1)",how:"Fall on an outstretched hand with the forearm rotating, or a forceful twist (racket sports, gymnastics). 1A central slit, 1B peripheral (ulnar/foveal) detachment, 1C distal ulnocarpal ligament tear, 1D radial detachment.",img:"MRI (3T, thin coronal PD/T2 fat-sat, or MR arthrography) shows fluid signal through the disc or at its attachments. Foveal (1B) tears matter most because they cause DRUJ instability — look for fluid between the styloid and the disc and loss of the normal low-signal foveal fibres."},
  {n:"Degenerative tear (Palmer class 2)",how:"Years of ulnar impaction, usually with positive ulnar variance. 2A thinning, 2B plus cartilage damage, 2C perforation, 2D plus LT ligament tear, 2E plus arthritis.",img:"Central disc thinning or perforation with lunate and ulna-head marrow changes."}],
 pearl:"A central perforation in a 60-year-old with a long ulna is degenerative and common; a peripheral/foveal tear in a young athlete with DRUJ laxity is the one that needs repair.",
 links:[P.tfccPalmer,P.tfcc3T,P.tfccRefine,P.tfccBeyond,P.uisTfcc]},

/* ---------------- LIGAMENTS ---------------- */
sl:{name:"Scapholunate (SL) ligament",group:"lig",
 plain:"A C-shaped band joining the scaphoid to the lunate. It has three parts: dorsal (thickest and strongest), proximal (thin membrane) and palmar.",
 does:"Keeps the scaphoid and lunate moving together. Without it the scaphoid flops forward (flexes) and the lunate tips backward (extends) — the DISI pattern.",
 injuries:[
  {n:"SL ligament tear / scapholunate dissociation",how:"Fall on the outstretched hand with the wrist bent back and rotated toward the little finger. The most common cause of wrist instability, and Mayfield stage I of a perilunate injury.",img:"PA view: SL gap over 3 mm ('Terry Thomas' sign — compare with the other side), scaphoid 'signet ring' sign (cortical ring from the flexed scaphoid). Lateral: SL angle over 70° and lunate tipped backward (DISI). A clenched-fist PA view brings out a dynamic gap. MRI is best in the coronal and axial planes; MR arthrography is more sensitive than plain MRI, but sensitivity is still limited for partial tears — arthroscopy remains the reference."},
  {n:"SLAC wrist (scapholunate advanced collapse)",how:"Untreated SL dissociation over years — the most common cause of wrist osteoarthritis.",img:"Stage 1: radial styloid–scaphoid narrowing. Stage 2: whole radioscaphoid joint. Stage 3: capitate migrates proximally into the SL gap, capitolunate arthritis. The radiolunate joint is spared until late."}],
 pearl:"Signal change in the SL ligament on MRI is very common in older people without injury — decide with the anatomy (gap, angle, fluid) rather than signal alone.",
 links:[P.slInj,P.slac,P.slMRIacc,P.slFist,P.slAxial,P.slSignal]},
lt:{name:"Lunotriquetral (LT) ligament",group:"lig",
 plain:"A C-shaped band joining the lunate to the triquetrum. Its palmar part is the strongest (the opposite of the SL ligament).",
 does:"Keeps the triquetrum and lunate moving together. If it tears, the scaphoid pulls the lunate forward (flexion) — the VISI pattern.",
 injuries:[
  {n:"LT ligament tear",how:"Fall backward onto the hand (wrist extended, forearm supinated, hand toward the thumb), or Mayfield stage III of a perilunate injury, or chronic ulnar impaction.",img:"Often normal on radiographs. Look for a step in Gilula's proximal arc, a VISI pattern on the lateral view (lunate tipped toward the palm, SL angle under 30°, capitolunate angle over 30°), and a gap or fluid on MRI/MR arthrography. Frequently accompanied by a TFCC tear."}],
 pearl:"VISI can be a normal lax-wrist variant, especially in young women — only call it when there are symptoms and the lunate stays flexed on a true lateral.",
 links:[P.instabGuide,P.radsource,P.instabStat,P.cindVisi]},
rsc:{name:"Radioscaphocapitate (RSC) ligament",group:"lig",
 plain:"A strong palm-side ligament from the radial styloid, across the waist of the scaphoid, to the capitate.",
 does:"Works as a sling the scaphoid rotates over. Together with the long radiolunate ligament it forms the boundary of the 'space of Poirier' — a weak spot in the palmar capsule over the capitolunate joint.",
 injuries:[{n:"Tear in perilunate injury",how:"Fails in Mayfield stage I alongside the SL ligament; the capitate then escapes through the space of Poirier in stage II.",img:"MRI: discontinuity or waviness of the ligament on coronal and sagittal images; associated radial styloid fracture."}],
 pearl:"A radial styloid fracture with a gap at the SL joint means the RSC has likely gone too — treat as a stage I perilunate injury.",
 links:[P.perilAJR,P.instabGuide]},
longRL:{name:"Long radiolunate ligament",group:"lig",
 plain:"A palm-side ligament from the radius to the lunate, running next to the RSC ligament.",
 does:"Stops the lunate sliding toward the ulna and helps hold it on the radius. Its ulnar edge is one border of the space of Poirier.",
 injuries:[{n:"Tear in perilunate injury (stage III)",how:"Fails as the injury travels around the ulnar side of the lunate.",img:"MRI: fluid tracking through the palmar capsule over the lunate."}],
 pearl:"Ulnar translocation of the carpus (lunate sliding off the radius toward the ulna) after rheumatoid disease or trauma means the radiolunate ligaments have stretched or torn.",
 links:[P.perilAJR,P.instabGuide]},
shortRL:{name:"Short radiolunate ligament",group:"lig",
 plain:"A short, thick ligament from the palmar edge of the lunate fossa straight to the lunate.",
 does:"The last thing holding the lunate on the radius. In lunate dislocation the lunate hinges forward on this ligament — if it also tears, the lunate can end up completely free, with a high risk of dying (AVN).",
 injuries:[{n:"Tear in stage IV perilunate injury",how:"Final ligament to fail; the lunate is then extruded into the carpal tunnel.",img:"Lateral view: lunate flipped toward the palm ('spilled teacup'); check the median nerve on MRI."}],
 pearl:"A lunate that has rotated more than 90° on the lateral view has usually lost its short radiolunate attachment — expect AVN.",
 links:[P.perilAJR,P.perilRev]},
drc:{name:"Dorsal radiocarpal (radiotriquetral) ligament",group:"lig",
 plain:"A ligament on the back of the wrist running from the radius diagonally to the triquetrum (and lunate).",
 does:"Holds the proximal row against the radius from behind; prevents the carpus sliding toward the ulna and stops the lunate tipping forward.",
 injuries:[
  {n:"Tear in stage IV perilunate injury",how:"Its failure lets the lunate leave the radius and dislocate toward the palm.",img:"MRI: disrupted low-signal band on the dorsal side; usually there is a dorsal triquetral avulsion or marrow oedema."},
  {n:"Non-dissociative VISI (CIND)",how:"Tearing this ligament without an LT tear can also let the whole proximal row flex.",img:"VISI on the lateral view with an intact SL and LT ligament on MRI."}],
 pearl:"A dorsal triquetral chip fracture is often this ligament pulling off its attachment.",
 links:[P.perilAJR,P.cindVisi,P.instabGuide]},
dic:{name:"Dorsal intercarpal ligament",group:"lig",
 plain:"A ligament across the back of the wrist from the triquetrum to the scaphoid and trapezoid, making a 'V' with the dorsal radiocarpal ligament.",
 does:"Backs up the SL ligament: it holds the scaphoid from behind, which is why surgeons use it to reconstruct the SL joint (capsulodesis).",
 injuries:[{n:"Tear with SL injury",how:"Extension of an SL ligament injury; loss of the secondary stabiliser makes SL dissociation static rather than dynamic.",img:"MRI: thickened, wavy or absent band on axial and sagittal images at the level of the distal scaphoid."}],
 pearl:"When the dorsal intercarpal ligament is intact, an SL tear may only show on stress (clenched-fist) views.",
 links:[P.slInj,P.instabGuide]},
ulnocarpal:{name:"Ulnocarpal ligaments (ulnolunate & ulnotriquetral)",group:"lig",
 plain:"Palm-side ligaments fanning from the base of the ulnar styloid (fovea) to the lunate and triquetrum. They are part of the TFCC.",
 does:"Stop the carpus sliding toward the palm and hold the ulnar side of the wrist together during forearm rotation.",
 injuries:[{n:"Palmer 1C tear",how:"Twisting injury or fall; the ligaments tear off the carpus.",img:"MRI/MR arthrography: fluid across the palmar ulnocarpal ligaments; often with a foveal TFCC tear."}],
 pearl:"Ulnar-sided pain with a normal central disc — look at the foveal attachment and these ligaments.",
 links:[P.tfccBeyond,P.tfccPalmer]},

/* ---------------- RETINACULA ---------------- */
flexRet:{name:"Flexor retinaculum (transverse carpal ligament)",group:"ret",
 plain:"A thick band across the palm side of the wrist bones. It attaches to the scaphoid tubercle and trapezium on the thumb side, and the pisiform and hook of hamate on the other. Together with the bones it makes a tunnel — the carpal tunnel.",
 does:"Holds the nine flexor tendons down as a pulley, and the median nerve runs through the same tunnel. Anything that thickens the contents or narrows the tunnel squeezes the nerve.",
 injuries:[{n:"Carpal tunnel syndrome",how:"Swelling of the tendon sheaths, fluid retention (pregnancy, thyroid disease), fractures, ganglia or simply small tunnels compress the median nerve.",img:"See Median nerve. The retinaculum itself can bow toward the palm (> 4 mm bowing on axial MRI) in carpal tunnel syndrome."}],
 pearl:"Use the carpal-tunnel view button above to see the tunnel end-on, the way you see it on axial MRI or ultrasound.",
 links:[P.ctsMulti,P.ctsMRI]},
extRet:{name:"Extensor retinaculum",group:"ret",
 plain:"A band across the back of the wrist that pins the extensor tendons down. Fibrous walls divide the tendons into six numbered compartments, from the thumb (1) to the little finger side (6).",
 does:"Prevents the tendons bow-stringing when you lift your hand.",
 injuries:[{n:"Stenosing tenosynovitis",how:"Overuse thickens the retinaculum over a compartment and traps the tendons — compartment 1 = de Quervain, compartment 6 = ECU.",img:"Ultrasound: thick, hypoechoic retinaculum, fluid in the sheath, increased blood flow on Doppler."}],
 pearl:"Count the compartments on axial MRI using Lister's tubercle: EPL (3) is just ulnar to it, ECRL/ECRB (2) just radial.",
 links:[P.dqSys,P.ecuMRI]},

/* ---------------- TENDONS ---------------- */
apl:{name:"Abductor pollicis longus (APL) — compartment 1",group:"tendon",
 plain:"Runs over the radial styloid to the base of the thumb metacarpal. Often has two or more slips.",
 does:"Pulls the thumb away from the palm and helps steady the thumb base.",
 injuries:[{n:"De Quervain tenosynovitis",how:"Repetitive thumb use with the wrist bent — new parents lifting babies, texting, racket sports. The sheath over the styloid thickens and squeezes the tendons.",img:"Ultrasound: thickened hypoechoic retinaculum and tendons, fluid in the sheath, Doppler flow; look for a septum dividing APL from EPB (type II variant) because it changes injection and surgery. MRI: tendon thickening and peritendinous oedema at the styloid. The many APL slips can look like a split tear — do not over-call."}],
 pearl:"Report a sub-compartment septum when you see it; it explains failed steroid injections.",
 links:[P.dqSys,P.dqUS,P.dqAJR,P.dqMRI]},
epb:{name:"Extensor pollicis brevis (EPB) — compartment 1",group:"tendon",
 plain:"A thin tendon next to the APL, running to the base of the thumb's first bone (proximal phalanx).",
 does:"Straightens the thumb at its base joint.",
 injuries:[{n:"De Quervain tenosynovitis (see APL)",how:"Same overuse mechanism; EPB is often the tendon trapped in a separate sub-compartment.",img:"Same as APL; EPB is usually the single tendon in the septated compartment."},
  {n:"Proximal intersection syndrome",how:"About 4 cm above the wrist the APL/EPB muscle bellies cross over the ECRL/ECRB tendons; rowing, weight training or shovelling causes friction between them.",img:"Ultrasound or MRI: fluid and oedema around both sets of tendons at the crossing point, well above the styloid."}],
 pearl:"Pain at the styloid = de Quervain; pain a hand's breadth higher on the forearm = intersection syndrome.",
 links:[P.dqUS,P.intersect,P.intersectUS,P.intersectTech,P.intersectEPB]},
ecrl:{name:"Extensor carpi radialis longus (ECRL) — compartment 2",group:"tendon",
 plain:"Runs down the back of the radius, radial to Lister's tubercle, to the base of the index metacarpal.",
 does:"Bends the wrist back and toward the thumb — the power tendon for gripping.",
 injuries:[{n:"Intersection syndrome (proximal and distal)",how:"Proximal: rubbed by the APL/EPB muscles crossing over it. Distal: rubbed by the EPL tendon crossing over it just below Lister's tubercle.",img:"Peritendinous fluid and oedema around ECRL/ECRB at the crossing site; ultrasound is quick and can show the friction dynamically."}],
 pearl:"Compartment 2 tenosynovitis just below Lister's tubercle without APL/EPB changes suggests distal intersection syndrome (EPL crossing).",
 links:[P.intersect,P.intersectUS,P.intersectTech]},
ecrb:{name:"Extensor carpi radialis brevis (ECRB) — compartment 2",group:"tendon",
 plain:"Lies next to ECRL and inserts on the base of the middle finger metacarpal.",
 does:"Bends the wrist straight back; the tendon most involved in 'tennis elbow' at its origin.",
 injuries:[{n:"Intersection syndrome / tenosynovitis",how:"As for ECRL.",img:"As for ECRL."},{n:"Dorsal wrist ganglion",how:"Not a tendon injury, but the classic dorsal ganglion arises from the SL joint and pushes up between the ECRB and EDC tendons.",img:"Well-defined fluid cyst with a neck tracking to the SL ligament on MRI or ultrasound."}],
 pearl:"Trace every dorsal ganglion to its source — most lead to the SL ligament.",
 links:[P.intersect,P.slInj]},
epl:{name:"Extensor pollicis longus (EPL) — compartment 3",group:"tendon",
 plain:"Runs just on the ulnar side of Lister's tubercle, then turns sharply around it toward the thumb, crossing over the ECR tendons. It forms the back edge of the anatomical snuff-box.",
 does:"Lifts the thumb up off the table (retropulsion).",
 injuries:[{n:"EPL rupture",how:"Attrition against Lister's tubercle, typically 2–8 weeks after an undisplaced distal radius fracture, or from rheumatoid tenosynovitis.",img:"Ultrasound/axial MRI: empty compartment 3, frayed retracted ends. Repair is usually by transferring the index extensor (EIP)."},
  {n:"Distal intersection syndrome",how:"Friction where EPL crosses over ECRL/ECRB.",img:"Fluid around both tendons at the crossing, just distal to Lister's tubercle."}],

function ribbon(id,prof,labelPos){

const anim={}; // id -> {from:[{p,r}], to:[{p,r}], t0, dur}
function setDisplacement(map){ // map: id -> [dx,dy,dz,rotX]
  const now=performance.now();

    REG[id].meshes.forEach((m,i)=>{ const b=REG[id].base[i];

 {q:"On a PA radiograph the gap between the scaphoid and lunate measures 5 mm. What has most likely happened?",o:["Lunotriquetral ligament tear","Scapholunate ligament tear","TFCC tear","Kienböck disease"],a:1,e:"A scapholunate interval over 3 mm (the 'Terry Thomas' sign) indicates scapholunate dissociation. Look also for the scaphoid ring sign and a DISI pattern on the lateral view.",rel:"sl"},
 {q:"On a lateral wrist radiograph the lunate is tipped backward (extended) and the scapholunate angle is 80°. This pattern is called:",o:["VISI","DISI","SLAC","SNAC"],a:1,e:"Dorsal intercalated segment instability: the lunate extends because the scaphoid, which normally pulls it into flexion, has been disconnected by a scapholunate ligament tear. Normal SL angle is 30–60°.",rel:"lunate"},
 {q:"In the Mayfield sequence of perilunate injury, which joint fails first?",o:["Lunotriquetral","Capitolunate","Scapholunate","Radiolunate"],a:2,e:"Stage I is scapholunate failure (or a scaphoid fracture in the greater-arc version), then capitolunate (II), lunotriquetral (III) and finally the lunate dislocates when the dorsal radiocarpal ligament fails (IV).",rel:"sl"},
 {q:"The 'spilled teacup' sign on a lateral radiograph means:",o:["Perilunate dislocation with the lunate still on the radius","Lunate dislocated toward the palm","Capitate fracture","Distal radius fracture with volar tilt"],a:1,e:"In a stage IV injury the lunate tips forward into the carpal tunnel like a spilled cup. The rest of the carpus lines up with the radius again, which can fool you on the PA view. The median nerve is at risk.",rel:"lunate"},
 {q:"Which structure is the main static stabiliser of the distal radio-ulnar joint?",o:["Extensor carpi ulnaris","TFCC","Lunotriquetral ligament","Interosseous membrane"],a:1,e:"The TFCC, particularly its deep foveal attachment (the dorsal and volar radio-ulnar ligaments), holds the ulna head in the sigmoid notch. A foveal (Palmer 1B) tear causes DRUJ instability.",rel:"tfcc"},
 {q:"A 58-year-old with ulnar-sided wrist pain has a long ulna on the PA view and MRI shows cysts and oedema on the ulnar side of the lunate with a central TFCC perforation. The diagnosis is:",o:["Kienböck disease","Ulnar impaction syndrome","Lunotriquetral tear","ECU tendinopathy"],a:1,e:"Positive ulnar variance loads the ulnar side of the carpus: the ulna head bumps the lunate (and triquetrum) and wears a central degenerative (Palmer class 2) hole in the TFCC.",rel:"ulna"},
 {q:"Which ulnar variance is associated with Kienböck disease?",o:["Positive (long ulna)","Neutral","Negative (short ulna)","It makes no difference"],a:2,e:"A short ulna is thought to concentrate load on the lunate through the radius, one of several 'at-risk lunate' factors. (Positive variance goes with ulnar impaction instead.)",rel:"lunate"},
 {q:"Lichtman stage I Kienböck disease is best detected by:",o:["Radiograph (sclerosis)","CT (collapse)","MRI (marrow signal)","Ultrasound"],a:2,e:"In stage I the radiograph is normal; only MRI shows the low T1 marrow signal of the lunate. Sclerosis appears in stage II, collapse in stage III.",rel:"lunate"},
 {q:"A golfer has pain in the heel of the palm after a mis-hit. Standard radiographs are normal. What is the reference-standard test for the suspected fracture?",o:["Carpal-tunnel view radiograph","CT","Ultrasound","Bone scan"],a:1,e:"Hook of hamate fractures are missed by standard views; CT has about 97% accuracy versus 80% for radiography. Missed fractures lead to non-union, ulnar nerve irritation and rupture of the ring/little finger flexor tendons.",rel:"hamateHook"},
 {q:"Which tendons run through the first extensor compartment over the radial styloid?",o:["ECRL and ECRB","APL and EPB","EPL","EDC and EIP"],a:1,e:"Abductor pollicis longus and extensor pollicis brevis. Thickening of their sheath over the styloid is de Quervain tenosynovitis; check for a septum separating the EPB, because it changes injection and surgery.",rel:"apl"},
 {q:"A patient cannot lift the thumb off a flat table 6 weeks after an undisplaced distal radius fracture. Which tendon has probably ruptured?",o:["Extensor pollicis brevis","Extensor pollicis longus","Flexor pollicis longus","Abductor pollicis longus"],a:1,e:"EPL runs around Lister's tubercle and frays against it after distal radius fractures, rupturing weeks later. Axial MRI or ultrasound shows an empty third compartment.",rel:"epl"},
 {q:"Where is the median nerve on an axial image of the carpal tunnel?",o:["Deep to the flexor tendons","Just under the flexor retinaculum on the thumb side","Beside the pisiform, superficial to the retinaculum","Inside Guyon's canal"],a:1,e:"The median nerve sits directly beneath the retinaculum, radial-central, on top of the FDS tendons. The ulnar nerve is the one beside the pisiform, superficial to the retinaculum, in Guyon's canal.",rel:"median"},
 {q:"On ultrasound, which measurement most supports carpal tunnel syndrome?",o:["Median nerve cross-sectional area enlarged at the pisiform level","Flexor tendon thickness","Distance between scaphoid and pisiform","Retinaculum length"],a:0,e:"An enlarged median nerve cross-sectional area at the tunnel inlet (pisiform level), often over 10–12 mm² or more than 2 mm² larger than at the forearm, plus flattening under the hamate and bowing of the retinaculum.",rel:"median"},
 {q:"A tennis player feels a painful snap on the ulnar side of the wrist when turning the forearm palm-up. Which tendon is most likely jumping out of its groove?",o:["Flexor carpi ulnaris","Extensor carpi ulnaris","Extensor digiti minimi","Palmaris longus"],a:1,e:"The ECU sits in a groove on the ulna head held by its own sub-sheath; a tear lets it subluxate in supination. Dynamic ultrasound with forearm rotation is the best test; some subluxation on static MRI in supination is normal.",rel:"ecu"},
 {q:"Which fracture is often visible only on the lateral view as a small fleck of bone behind the carpus?",o:["Scaphoid waist fracture","Dorsal triquetral avulsion","Hook of hamate fracture","Pisiform fracture"],a:1,e:"The dorsal triquetral chip is the second most common carpal fracture and hides on the PA view; it is usually an avulsion by the dorsal radiocarpal or intercarpal ligament.",rel:"triquetrum"},
 {q:"Which measurements should be reported on a distal radius fracture?",o:["SL angle and capitolunate angle","Volar tilt, radial inclination, radial height and ulnar variance","Ulnar variance only","Carpal height ratio"],a:1,e:"Those four (plus articular step/gap and DRUJ/ulnar styloid involvement) decide reduction and surgery. Normal: volar tilt ~11°, radial inclination ~22°, radial height ~11 mm, ulnar variance about neutral.",rel:"radiusDistal"},
 {q:"Which ligament forms one border of the space of Poirier, the weak spot through which the capitate dislocates?",o:["Dorsal intercarpal ligament","Radioscaphocapitate ligament","Lunotriquetral ligament","Ulnotriquetral ligament"],a:1,e:"The space of Poirier lies between the radioscaphocapitate and long radiolunate ligaments over the capitolunate joint on the palm side.",rel:"rsc"},
 {q:"Numbness of the little finger with normal sensation on the back of the hand suggests compression of the ulnar nerve at the:",o:["Elbow (cubital tunnel)","Wrist (Guyon's canal)","Forearm","Brachial plexus"],a:1,e:"The dorsal sensory branch leaves the ulnar nerve above the wrist, so sparing of the dorsal hand points to Guyon's canal — think hook of hamate fracture, ganglion, aberrant muscle or handlebar palsy.",rel:"ulnarN"},
 {q:"SLAC wrist arthritis begins at which joint?",o:["Radiolunate","Radial styloid–scaphoid","Capitolunate","Pisotriquetral"],a:1,e:"Scapholunate advanced collapse progresses predictably: radial styloid–scaphoid (stage 1), whole radioscaphoid joint (2), then capitolunate (3). The radiolunate joint is spared until late.",rel:"sl"},
 {q:"On the lateral view the lunate is tipped toward the palm (flexed) with a normal or reduced SL angle. Which ligament is most likely torn?",o:["Scapholunate ligament","Lunotriquetral ligament","TFCC","Radioscaphocapitate ligament"],a:1,e:"Volar intercalated segment instability (VISI): with the LT ligament gone, the scaphoid drags the lunate into flexion. It can also be a lax-wrist variant, so correlate with symptoms.",rel:"lt"}
];
let quiz=null;
function quizHideLabels(){ return mode==='quiz' && quiz && quiz.qs && quiz.i<quiz.qs.length && !quiz.answered && (quiz.qs[quiz.i].kind!=='mcq'); }
function quizWantsClick(){ return quiz && quiz.qs && quiz.i<quiz.qs.length && quiz.qs[quiz.i].kind==='find' && !quiz.answered; }
const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function makeQuestion(kind){
  const ids=Object.keys(STRUCT).filter(id=>id!=='radiusShaft'&&id!=='mc2'&&id!=='mc4');
  if(kind==='mcq'){ const m=MCQ[Math.floor(Math.random()*MCQ.length)]; const perm=shuffle([0,1,2,3]); return {kind,m,perm}; }
  const id=ids[Math.floor(Math.random()*ids.length)]; const g=STRUCT[id].group;
  let pool=shuffle(ids.filter(x=>x!==id && STRUCT[x].group===g)); if(pool.length<3) pool=pool.concat(shuffle(ids.filter(x=>x!==id && !pool.includes(x)))); 
  const options=shuffle([id,...pool.slice(0,3)]);
  return {kind,id,options,view:PREF_VIEW[id]||'dorsal'};
}
function startQuiz(type){
  const kinds=type==='mixed'?['name','find','mcq']:[type];
  const qs=[]; const usedMcq=new Set();
  for(let i=0;i<10;i++){ let q=makeQuestion(kinds[i%kinds.length]); if(q.kind==='mcq'){ let tries=0; while(usedMcq.has(q.m.q)&&tries++<30) q=makeQuestion('mcq'); usedMcq.add(q.m.q); } qs.push(q); }
  quiz={type,qs,i:0,score:0,answered:false,log:[]}; showQuestion();
}
function showQuestion(){
  const q=quiz.qs[quiz.i]; quiz.answered=false; selected=null; setDisplacement(null);
  if(q.kind==='name'){ pulse=new Set([q.id]); setView(q.view); }
  else if(q.kind==='find'){ pulse=new Set(); setView(q.view); }
  else { pulse=new Set(); }
  updateEmissive();
  const head=`<button class="back" data-quizmenu="1">← Quiz menu</button><h2>Quiz</h2>
   <div class="qscore"><span>Question ${quiz.i+1} of ${quiz.qs.length}</span><span>Score ${quiz.score}</span></div><div class="qbar"><i style="width:${quiz.i/quiz.qs.length*100}%"></i></div>`;
  if(q.kind==='name'){
    panel.innerHTML=head+`<p class="steptitle">Which structure is glowing red?</p><p class="note">Rotate the model if you need to. Labels are hidden during the question.</p>
     ${q.options.map(o=>`<button class="qopt" data-ans="${o}">${esc(STRUCT[o].name)}</button>`).join('')}`;
  } else if(q.kind==='find'){
    panel.innerHTML=head+`<p class="steptitle">Click on the ${esc(STRUCT[q.id].name)}</p><div class="findbox">Find it in the 3D model and click it.</div><p class="note">You can rotate, zoom and change the view first — clicking a structure counts as your answer.</p>`;
  } else {
    panel.innerHTML=head+`<p class="steptitle">${esc(q.m.q)}</p>${q.perm.map(i=>`<button class="qopt" data-mcq="${i}">${esc(q.m.o[i])}</button>`).join('')}`;
  }
  document.querySelector('aside').scrollTop=0;
}
function quizFeedback(ok,text,rel){
  quiz.answered=true; if(ok) quiz.score++;
  quiz.log.push({ok,rel});
  const div=document.createElement('div');
  div.innerHTML=`<p class="verdict ${ok?'ok':'no'}">${ok?'Correct.':'Not quite.'}</p><p>${text}</p>
    <div class="chips"><button class="chip" data-go="${rel}">Read about the ${esc(STRUCT[rel].name.replace(/\s—.*$/,''))}</button></div>
    <div class="stepnav"><span class="spacer"></span><button data-quiznext="1">${quiz.i+1<quiz.qs.length?'Next question':'See results'}</button></div>`;
  panel.appendChild(div); document.querySelectorAll('.qopt').forEach(b=>b.disabled=true);
  updateEmissive();
}
function quizAnswer(id){
  const q=quiz.qs[quiz.i]; const ok=id===q.id;
  document.querySelectorAll('.qopt').forEach(b=>{ if(b.dataset.ans===q.id) b.classList.add('right'); else if(b.dataset.ans===id&&!ok) b.classList.add('wrong'); });
  pulse=new Set([q.id]);
  quizFeedback(ok,`It is the <b>${esc(STRUCT[q.id].name)}</b>. ${esc(STRUCT[q.id].plain)}`,q.id);
}
function quizClick(id){
  const q=quiz.qs[quiz.i]; const ok=id===q.id; pulse=new Set([q.id]);
  quizFeedback(ok, ok?`You found the <b>${esc(STRUCT[q.id].name)}</b>. ${esc(STRUCT[q.id].does)}`:`You clicked the <b>${esc(STRUCT[id].name)}</b>. The <b>${esc(STRUCT[q.id].name)}</b> is now glowing red. ${esc(STRUCT[q.id].plain)}`,q.id);
}
function quizMcq(i){
  const q=quiz.qs[quiz.i]; const ok=i===q.m.a;
  document.querySelectorAll('.qopt').forEach(b=>{ const k=parseInt(b.dataset.mcq,10); if(k===q.m.a) b.classList.add('right'); else if(k===i&&!ok) b.classList.add('wrong'); });
  pulse=new Set([q.m.rel]); setView(PREF_VIEW[q.m.rel]||'dorsal');
  quizFeedback(ok,esc(q.m.e),q.m.rel);
}
function quizNext(){ quiz.i++; if(quiz.i<quiz.qs.length) showQuestion(); else quizResults(); }
function quizResults(){
  pulse=new Set(); updateEmissive();
  const pct=Math.round(quiz.score/quiz.qs.length*100);
  const missed=[...new Set(quiz.log.filter(l=>!l.ok).map(l=>l.rel))];
  panel.innerHTML=`<button class="back" data-quizmenu="1">← Quiz menu</button><h2>Results</h2>
   <p class="plain">You scored <b>${quiz.score} / ${quiz.qs.length}</b> (${pct}%).</p>
   ${missed.length?`<h3>Worth reviewing</h3>${chips(missed)}`:'<p>Every question right — try the "Find it" or mixed rounds for a harder run.</p>'}
   <div class="chips"><button class="chip" data-quizstart="${quiz.type}">Play again</button><button class="chip" data-quizstart="mixed">Mixed round</button></div>`;
}
function renderQuizMenu(){
  quiz=null; pulse=new Set(); selected=null; setDisplacement(null); updateEmissive();
  panel.innerHTML=`<h2>Quiz</h2><p class="plain">Ten questions per round. Structures glow in the model and labels are hidden while you answer. Wrong answers link straight back to the teaching page.</p>
   <button class="mechcard" data-quizstart="name"><b>Name the glowing structure</b><span>A structure lights up in red; pick its name from four options.</span></button>
   <button class="mechcard" data-quizstart="find"><b>Find it</b><span>You are given a name — rotate the model and click the right structure.</span></button>
   <button class="mechcard" data-quizstart="mcq"><b>Injury and imaging questions</b><span>Clinical scenarios: which structure, which sign, which test.</span></button>
   <button class="mechcard" data-quizstart="mixed"><b>Mixed round</b><span>All three types, shuffled.</span></button>`;
}
panel.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.quizstart){ startQuiz(t.dataset.quizstart); }
  else if(t.dataset.quizmenu){ renderQuizMenu(); }
  else if(t.dataset.ans && !quiz.answered){ quizAnswer(t.dataset.ans); }
  else if(t.dataset.mcq!==undefined && !quiz.answered){ quizMcq(parseInt(t.dataset.mcq,10)); }
  else if(t.dataset.quiznext){ quizNext(); }
});

renderHome(); setView('dorsal');
</script>
